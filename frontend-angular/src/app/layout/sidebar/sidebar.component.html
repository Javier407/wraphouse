<!-- src/app/layout/sidebar/sidebar.component.html -->

<aside class="sidebar" [ngClass]="{ open }">

  <!-- ── Brand ── -->
  <div class="sidebar-brand">
    <div class="brand-icon">
      <svg viewBox="0 0 32 32" fill="none">
        <circle cx="8"  cy="22" r="5" stroke="currentColor" stroke-width="2"/>
        <circle cx="24" cy="22" r="5" stroke="currentColor" stroke-width="2"/>
        <path d="M13 22L16 10L20 14L24 10"
              stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 22L13 22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="16" cy="8" r="2" fill="currentColor"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">MotoTrack</span>
      <span class="brand-tag">CRM System</span>
    </div>
  </div>

  <!-- ── Nav ── -->
  <nav class="sidebar-nav">

    <p class="nav-label-group">Principal</p>
    <ul class="nav-list">

      <li class="nav-item"
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="linkClicked.emit()">
        <span class="nav-icon">
          <svg viewBox="0 0 20 20" fill="none">
            <rect x="2"  y="2"  width="7" height="7" rx="1.5" fill="currentColor"/>
            <rect x="11" y="2"  width="7" height="7" rx="1.5" fill="currentColor" opacity=".5"/>
            <rect x="2"  y="11" width="7" height="7" rx="1.5" fill="currentColor" opacity=".5"/>
            <rect x="11" y="11" width="7" height="7" rx="1.5" fill="currentColor" opacity=".3"/>
          </svg>
        </span>
        <span class="nav-text">Dashboard</span>
        <span class="nav-bar"></span>
      </li>

      <li class="nav-item"
          routerLink="/motos"
          routerLinkActive="active"
          (click)="linkClicked.emit()">
        <span class="nav-icon">
          <svg viewBox="0 0 20 20" fill="none">
            <circle cx="5" cy="14" r="3" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="15" cy="14" r="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 14L10 7L13 10L15 7"
                  stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="5.5" r="1.5" fill="currentColor"/>
          </svg>
        </span>
        <span class="nav-text">Motocicletas</span>
        <span class="nav-badge">{{ (motos$ | async)?.length ?? 0 }}</span>
        <span class="nav-bar"></span>
      </li>

      <li class="nav-item"
          routerLink="/clientes"
          routerLinkActive="active"
          (click)="linkClicked.emit()">
        <span class="nav-icon">
          <svg viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M4 17c0-3.314 2.686-6 6-6s6 2.686 6 6"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="nav-text">Clientes</span>
        <span class="nav-soon">Próximo</span>
        <span class="nav-bar"></span>
      </li>

    </ul>

    <p class="nav-label-group">Sistema</p>
    <ul class="nav-list">
      <li class="nav-item disabled">
        <span class="nav-icon">
          <svg viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 2v2M10 16v2M2 10h2M16 10h2
                     M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42
                     M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="nav-text">Configuración</span>
        <span class="nav-bar"></span>
      </li>
    </ul>

  </nav>

  <!-- ── Footer / User ── -->
  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar">V</div>
      <div class="user-info">
        <span class="user-name">Vinni Admin</span>
        <span class="user-role">Administrador</span>
      </div>
      <div class="user-dot"></div>
    </div>
  </div>

</aside>
