quarkus:

  # ── Datasource ───────────────────────────────────────────────────────────────
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wraphouse}${DB_PARAMS:}
      min-size: ${DB_POOL_MIN:2}
      max-size: ${DB_POOL_MAX:8}
      acquisition-timeout: 10S
      idle-removal-interval: PT1M
      max-lifetime: PT5M
      new-connection-sql: SELECT 1
      background-validation-interval: PT30S

  # ── HTTP ─────────────────────────────────────────────────────────────────────
  http:
    port: ${PORT:8860}
    root-path: /kick
    cors:
      "~": true
      origins: ${CORS_ORIGINS:http://localhost:4200}
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: Content-Type,Authorization,Accept,Origin

  # ── Hibernate ORM ────────────────────────────────────────────────────────────
  hibernate-orm:
    schema-management:
      strategy: ${HIBERNATE_DDL:update}
    log:
      sql: false
    jdbc:
      statement-batch-size: 25

  # ── Logging ──────────────────────────────────────────────────────────────────
  log:
    level: INFO
    category:
      "co.vinni":
        level: DEBUG
      "org.hibernate.SQL":
        level: ${SQL_LOG_LEVEL:WARN}
    console:
      enabled: true

  # ── Swagger UI ───────────────────────────────────────────────────────────────
  swagger-ui:
    always-include: true
    path: /q/swagger-ui

# ── Perfil: desarrollo local ─────────────────────────────────────────────────
# La JDBC URL se toma del bloque principal (usa env vars del .env).
# Aquí solo se ajustan opciones de desarrollo: logs SQL, DDL auto-update.
"%dev":
  quarkus:
    hibernate-orm:
      schema-management:
        strategy: update
      log:
        sql: true
    log:
      category:
        "org.hibernate.SQL":
          level: DEBUG

# ── Perfil: producción (Render) ──────────────────────────────────────────────
"%prod":
  quarkus:
    datasource:
      jdbc:
        url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
        min-size: 2
        max-size: 5
    hibernate-orm:
      schema-management:
        strategy: ${HIBERNATE_DDL:update}
      log:
        sql: false
    log:
      level: WARN
      category:
        "co.vinni":
          level: INFO
    swagger-ui:
      always-include: false

# ── OpenAPI ────────────────────────────────────────────────────────────────────
mp:
  openapi:
    extensions:
      smallrye:
        info:
          title: WrapHouse CRM API
          version: 1.0.0
          description: API REST para gestión de motos y servicios
