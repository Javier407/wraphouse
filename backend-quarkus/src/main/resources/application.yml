quarkus:
  datasource:
    db-kind: postgresql
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wraphouse}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  http:
    port: ${PORT:8860}
    root-path: /kick
    cors: true
    cors-origins: ${CORS_ORIGINS:http://localhost:4200}
    cors-methods: GET,POST,PUT,DELETE,OPTIONS
    cors-headers: Content-Type,Authorization,Accept

  hibernate-orm:
    schema-management:
      strategy: ${HIBERNATE_DDL:update}
    log:
      sql: false

  log:
    level: INFO
    category:
      "co.vinni":
        level: DEBUG
    console:
      enabled: true

  swagger-ui:
    always-include: true
    path: /q/swagger-ui

mp:
  openapi:
    extensions:
      smallrye:
        info:
          title: WrapHouse CRM API
          version: 1.0.0
          description: API REST para gestión de motos y servicios
